# Wakes the TaskMate API and runs one idempotent reminder pass every 30 minutes.
# Free Render web services sleep when idle, so their in-process scheduler stops;
# this keeps reminders (and WhatsApp delivery, if configured) on schedule.
# Inactive until both repository secrets are set:
#   TASKMATE_API_URL       e.g. https://taskmate-api.onrender.com
#   REMINDER_CRON_SECRET   same value as the API service's REMINDER_CRON_SECRET
name: Deadline reminders

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder pass
        env:
          API_URL: ${{ secrets.TASKMATE_API_URL }}
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Reminder secrets are not configured; skipping."
            exit 0
          fi
          # A sleeping free instance can take ~1 minute to start.
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 20 \
            -X POST "$API_URL/internal/reminders/run" \
            -H "X-Reminder-Cron-Secret: $CRON_SECRET"
